[project]
name = "data-agent"
version = "0.1.0"
description = "Text-to-SQL 数据智能代理，用自然语言查询 MySQL 数据库"
requires-python = ">=3.10"
dependencies = [
    # Web API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # 数据库
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    # LLM (智谱 Anthropic 兼容接口)
    "anthropic>=0.30",
    # 配置
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # 工具
    "sqlparse>=0.5",
]

[project.scripts]
data-agent = "data_agent.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
